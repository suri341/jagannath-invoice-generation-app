name: Deploy Invoice App to EKS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/invoice-backend:${{ github.sha }} ./backend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/invoice-backend:${{ github.sha }}

      - name: Build and push frontend image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/invoice-frontend:${{ github.sha }} ./frontend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/invoice-frontend:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig --region ${{ secrets.AWS_REGION }} --name ${{ secrets.EKS_CLUSTER_NAME }}

      - name: Deploy with Helm
        run: |
          helm upgrade --install invoice-app ./invoice-app \
            --namespace invoice-app \
            --create-namespace \
            --set image.username=${{ secrets.DOCKERHUB_USERNAME }} \
            --set image.backendTag=${{ github.sha }} \
            --set image.frontendTag=${{ github.sha }} \
            --set postgres.password=${{ secrets.DB_PASSWORD }} \
            --set backend.secretKey=${{ secrets.BACKEND_SECRET_KEY }} \
            --set backend.corsOrigins=https://invoice.vihan.store,https://backend.vihan.store \
            --set ingress.frontendHost=invoice.vihan.store \
            --set ingress.backendHost=backend.vihan.store

      - name: Wait for app pods
        run: |
          kubectl get pods -n invoice-app
          kubectl rollout status deployment/invoice-backend -n invoice-app --timeout=180s
          kubectl rollout status deployment/invoice-frontend -n invoice-app --timeout=180s

      - name: Seed database on first deploy
        run: |
          BACKEND_POD=$(kubectl get pod -n invoice-app -l app=invoice-backend -o jsonpath='{.items[0].metadata.name}')
          kubectl exec -n invoice-app "$BACKEND_POD" -- python3 -m app.seed_data

      - name: Show final resources
        run: |
          kubectl get svc -n invoice-app
          kubectl get ingress -n invoice-app
